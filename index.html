<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Cloud IDE Mojib</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cloud IDE Mojib</h1>
    <p>پلتفرم کدنویسی ابری مجهز به هوش مصنوعی</p>
  </header>

  <main>
    <section id="editor">
      <textarea id="code" placeholder="کدت رو اینجا بنویس..."></textarea>
      <button id="run">اجرا</button>
    </section>

    <section id="output">
      <h2>خروجی</h2>
      <iframe id="result"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
